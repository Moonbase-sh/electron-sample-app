<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Activate app</title>

  </head>
  <body>
    <h1>🔒 Activate app</h1>
    <p>This app requires a license, click the button below to get started</p>
    <button id="activate">
      Activate
    </button>
    <button id="activate-offline">
      Activate offline
    </button>
    <button id="select-license">
      Select license
    </button>
    <p id="offline-instructions" hidden>
      Please upload the device token to <a href="https://demo.moonbase.sh/activate" target="_blank">https://demo.moonbase.sh/activate</a>,
      then select the license file you get back.
    </p>
    <p id="error" hidden></p>
    <script type="module" src="/src/license-activation/renderer.ts"></script>
  </body>
</html>
